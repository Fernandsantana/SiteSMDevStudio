name: smdevstudio-site
services:
  web:
    image: ${SM_SITE_IMAGE:?Defina a imagem corrigida do site por ID imutavel}
    pull_policy: never
    restart: unless-stopped
    user: "1000:1000"
    read_only: true
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: [no-new-privileges:true]
    environment:
      XDG_CONFIG_HOME: /tmp/config
      XDG_DATA_HOME: /tmp/data
    tmpfs: ["/tmp:size=8m,mode=1777"]
    volumes:
      - type: bind
        source: ${SM_RELEASE_DIR:?Defina pasta absoluta de release validada}
        target: /srv
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./Caddyfile
        target: /etc/caddy/Caddyfile
        read_only: true
    mem_limit: 64m
    cpus: 0.15
    pids_limit: 40
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1:8080/_health]
      interval: 30s
      timeout: 3s
      retries: 3
    logging:
      driver: local
      options:
        max-size: "5m"
        max-file: "2"
    networks:
      entrada:
        aliases: [smdevstudio-web]
networks:
  entrada:
    name: smdevstudio-entrada
    internal: true
